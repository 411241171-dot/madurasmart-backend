<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login MaduraSmart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-brand">
  <img src="logo.jpeg" class="logo">
  <div>
    <h1>MaduraSmart</h1>
    <p>Catatan Warung Lebih Rapih</p>
  </div>
</div>

<div class="login-box">
  <h2>Login MaduraSmart</h2>

  <label>Username / Nomor HP</label>
  <input type="text" id="username" placeholder="Username . . .">

  <label>Password</label>
  <input type="password" id="password" placeholder="Password . . .">
  <p id="warningText" class="warning-text" style="color: yellow; font-weight: bold;"></p>
  
  <div class="login-button-group">
    <a href="#" onclick="login()">Login</a>
    <a href="register.html">Register</a>
  </div>
</div>

<script>
function login() {
  document.getElementById("warningText").innerText = "";
  let usernameInput = document.getElementById("username").value.trim();
  let passwordInput = document.getElementById("password").value;

  if (usernameInput === "" || passwordInput === "") {
    document.getElementById("warningText").innerText = "Username dan password wajib diisi!";
    return;
  }

  fetch('http://localhost:3000/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: usernameInput, password: passwordInput })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem("username", data.username);
      tampilPopup("Berhasil!", "Selamat Datang di MaduraSmart!");
    } else {
      document.getElementById("warningText").innerText = data.message;
    }
  })
  .catch(err => {
    document.getElementById("warningText").innerText = "Waduh, gagal terhubung ke server Node.js!";
    console.error(err);
  });
}

function tampilPopup(judul, pesan) {
  document.getElementById("popupTitle").innerText = judul;
  document.getElementById("popupMessage").innerText = pesan;
  document.getElementById("popupCustom").style.display = "flex";
}

function tutupPopup() {
  document.getElementById("popupCustom").style.display = "none";
  if (document.getElementById("popupTitle").innerText === "Berhasil!") {
    window.location.href = "dashboard.html";
  }
}
</script>

<div id="popupCustom" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <h3 id="popupTitle">Info</h3>
    <p id="popupMessage">Pesan</p>
    <button onclick="tutupPopup()">OK</button>
  </div>
</div>

</body>
</html>
